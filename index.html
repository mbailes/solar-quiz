<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#05070f">
<title>Solar System Quiz</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header class="top">
    <h1>Solar System Quiz</h1>
    <div class="progress" aria-live="polite"><span id="qnum">1</span>/<span id="qtotal">8</span> · Score <span id="score">0</span></div>
  </header>

  <section class="stage" aria-label="Rotating planet">
    <canvas id="planet" aria-hidden="true"></canvas>
    <div class="planet-name" id="pname">Mercury</div>
    <div class="hint">Drag to spin</div>
  </section>

  <section class="card" id="card">
    <details class="stats" id="statsBox">
      <summary>Vital stats</summary>
      <dl id="stats"></dl>
      <p class="fact" id="fact"></p>
    </details>

    <h2 id="question"></h2>
    <div class="options" id="options" role="group"></div>
    <p class="why" id="why" hidden></p>
    <button class="next" id="next" hidden>Next planet →</button>
  </section>

  <section class="card done" id="done" hidden>
    <h2>Quiz complete!</h2>
    <p id="final"></p>
    <button class="next" id="restart">Play again</button>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
